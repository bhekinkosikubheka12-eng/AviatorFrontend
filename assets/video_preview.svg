<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0e14" />
      <stop offset="50%" stop-color="#121824" />
      <stop offset="100%" stop-color="#0a0c10" />
    </linearGradient>

    <!-- Curve Glow Gradient -->
    <linearGradient id="curveGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e61c5a" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#e61c5a" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ffb300" stop-opacity="1" />
    </linearGradient>

    <!-- Curve Fill Gradient -->
    <linearGradient id="curveAreaGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e61c5a" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#e61c5a" stop-opacity="0.0" />
    </linearGradient>

    <!-- Play Button Glow -->
    <filter id="playGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="630" rx="16" fill="url(#bgGradient)" stroke="#222b3d" stroke-width="2" />

  <!-- Grid Lines -->
  <g opacity="0.12" stroke="#4fc3f7" stroke-width="1">
    <line x1="100" y1="100" x2="1100" y2="100" />
    <line x1="100" y1="180" x2="1100" y2="180" />
    <line x1="100" y1="260" x2="1100" y2="260" />
    <line x1="100" y1="340" x2="1100" y2="340" />
    <line x1="100" y1="420" x2="1100" y2="420" />
    <line x1="100" y1="500" x2="1100" y2="500" />

    <line x1="200" y1="80" x2="200" y2="520" />
    <line x1="400" y1="80" x2="400" y2="520" />
    <line x1="600" y1="80" x2="600" y2="520" />
    <line x1="800" y1="80" x2="800" y2="520" />
    <line x1="1000" y1="80" x2="1000" y2="520" />
  </g>

  <!-- Exponential Flight Area Fill -->
  <path d="M 120 500 Q 600 480, 850 300 T 1020 160 L 1020 500 Z" fill="url(#curveAreaGradient)" />

  <!-- Flight Curve Line -->
  <path d="M 120 500 Q 600 480, 850 300 T 1020 160" fill="none" stroke="url(#curveGradient)" stroke-width="7" stroke-linecap="round" filter="url(#neonGlow)" />

  <!-- Jet Fighter Airplane Icon at Curve Tip -->
  <g transform="translate(1020, 160) rotate(-38)">
    <!-- Exhaust Flame -->
    <path d="M -30 0 L -70 -8 L -55 0 L -70 8 Z" fill="#ff9100" filter="url(#neonGlow)" />
    <path d="M -30 0 L -50 -4 L -40 0 L -50 4 Z" fill="#ffffff" />
    <!-- Jet Fuselage -->
    <polygon points="40,0 -15,-12 -28,-6 -25,0 -28,6 -15,12" fill="#e61c5a" stroke="#ff4d79" stroke-width="2" />
    <!-- Wings -->
    <polygon points="5,-3 -22,-36 -28,-34 -15,-3" fill="#c21345" />
    <polygon points="5,3 -22,36 -28,34 -15,3" fill="#c21345" />
    <!-- Tail Fin -->
    <polygon points="-18,0 -28,-18 -32,-18 -26,0" fill="#a00f38" />
  </g>

  <!-- Multiplier Text Display -->
  <text x="600" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="82" font-weight="900" fill="#ffffff" text-anchor="middle" filter="url(#neonGlow)" letter-spacing="2">
    14.82x
  </text>
  <text x="600" y="278" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#ffb300" text-anchor="middle" letter-spacing="4">
    CURRENT MULTIPLIER
  </text>

  <!-- Top Multiplier History Bar -->
  <g transform="translate(140, 45)">
    <rect x="0" y="0" width="80" height="30" rx="15" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
    <text x="40" y="20" font-family="sans-serif" font-size="13" font-weight="700" fill="#60a5fa" text-anchor="middle">1.45x</text>

    <rect x="95" y="0" width="80" height="30" rx="15" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
    <text x="135" y="20" font-family="sans-serif" font-size="13" font-weight="700" fill="#60a5fa" text-anchor="middle">1.82x</text>

    <rect x="190" y="0" width="80" height="30" rx="15" fill="#1e293b" stroke="#a855f7" stroke-width="1.5" />
    <text x="230" y="20" font-family="sans-serif" font-size="13" font-weight="700" fill="#c084fc" text-anchor="middle">3.24x</text>

    <rect x="285" y="0" width="80" height="30" rx="15" fill="#1e293b" stroke="#e61c5a" stroke-width="1.5" />
    <text x="325" y="20" font-family="sans-serif" font-size="13" font-weight="700" fill="#f43f5e" text-anchor="middle">12.60x</text>

    <rect x="380" y="0" width="80" height="30" rx="15" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
    <text x="420" y="20" font-family="sans-serif" font-size="13" font-weight="700" fill="#60a5fa" text-anchor="middle">1.12x</text>

    <rect x="475" y="0" width="80" height="30" rx="15" fill="#1e293b" stroke="#e61c5a" stroke-width="1.5" />
    <text x="515" y="20" font-family="sans-serif" font-size="13" font-weight="700" fill="#f43f5e" text-anchor="middle">24.18x</text>

    <rect x="570" y="0" width="80" height="30" rx="15" fill="#1e293b" stroke="#a855f7" stroke-width="1.5" />
    <text x="610" y="20" font-family="sans-serif" font-size="13" font-weight="700" fill="#c084fc" text-anchor="middle">5.80x</text>

    <rect x="665" y="0" width="80" height="30" rx="15" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
    <text x="705" y="20" font-family="sans-serif" font-size="13" font-weight="700" fill="#60a5fa" text-anchor="middle">1.94x</text>

    <rect x="760" y="0" width="80" height="30" rx="15" fill="#1e293b" stroke="#e61c5a" stroke-width="1.5" />
    <text x="800" y="20" font-family="sans-serif" font-size="13" font-weight="700" fill="#f43f5e" text-anchor="middle">108.5x</text>

    <rect x="855" y="0" width="80" height="30" rx="15" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
    <text x="895" y="20" font-family="sans-serif" font-size="13" font-weight="700" fill="#60a5fa" text-anchor="middle">1.02x</text>
  </g>

  <!-- Large Central Video Play Button with Pulsing Glow -->
  <g transform="translate(600, 370)" filter="url(#playGlow)">
    <!-- Outer Translucent Pulse Ring -->
    <circle cx="0" cy="0" r="62" fill="rgba(230, 28, 90, 0.25)" stroke="#e61c5a" stroke-width="2.5" />
    <!-- Glassmorphic Button Body -->
    <circle cx="0" cy="0" r="48" fill="#e61c5a" />
    <!-- Triangle Play Glyph -->
    <polygon points="-12,-22 22,0 -12,22" fill="#ffffff" />
  </g>

  <!-- Bottom Interactive Banner Bar -->
  <g transform="translate(200, 545)">
    <rect x="0" y="0" width="800" height="52" rx="26" fill="rgba(15, 23, 42, 0.9)" stroke="#e61c5a" stroke-width="1.5" />
    <circle cx="34" cy="26" r="10" fill="#ef4444" />
    <circle cx="34" cy="26" r="5" fill="#ffffff" />
    <text x="60" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700" fill="#ffffff">
      ▶ Click to Watch Full 60 FPS Gameplay Video Demo (Firebase Cloud Stream)
    </text>
  </g>
</svg>
